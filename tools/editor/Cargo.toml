# SPDX-License-Identifier: Apache-2.0
# editor — the Rime editor (M9): a client of a live engine process (ADR-0016). It launches
# `rime-engine --editor-host`, connects over the local socket, and edits the world through the
# reflection-described editor channel (rime-protocol). v1 ships the headless `--smoke` end-to-end
# check; the egui docking shell + streamed viewport follow (Mac-eyeballed per ADR-0031).
[package]
name = "editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Rime editor — a client of a live engine process (M9)"

[[bin]]
name = "editor"
path = "src/main.rs"

[features]
# The interactive egui docking shell (eframe → egui/egui_dock + wgpu/winit). Off by default so the
# headless `editor --smoke` — the CI-critical path — stays a light, fast build with no windowing
# stack. Turn it on to build/run the real editor: `cargo run -p editor --features gui`.
default = []
#
# `egui_kittest` rides on `gui` too, although only the click tests (src/gui/click_tests.rs) use it.
# Cargo cannot feature-gate a dev-dependency, and a plain one would drag egui + winit into the plain
# `cargo test -p editor` — the light headless build this feature split exists to protect. As an
# optional dependency it costs the shipped binary nothing (nothing outside `#[cfg(test)]` names it,
# and its `eframe/accesskit` is already on through eframe's defaults).
gui = ["dep:eframe", "dep:egui_dock", "dep:egui_kittest"]

[dependencies]
rime-protocol = { path = "../rime-protocol" }
eframe = { version = "0.31", optional = true }
egui_dock = { version = "0.16", optional = true }
egui_kittest = { version = "0.31", optional = true, features = ["eframe"] }

# The editor's half of the s1.4 local socket, on Windows only.
#
# Not a second transport: the engine has served AF_UNIX on Windows since the Win32 socket backend
# landed (Windows 10 1803+; see engine/platform/include/rime/platform/socket.hpp). The gap was in
# Rust's standard library, which puts `UnixStream` behind `std::os::unix` and offers no Windows
# equivalent -- so naming it made this crate fail to COMPILE here, which is why `--features gui`
# was unbuildable on Windows and `--smoke` shipped a "Unix-only for now" stub. This crate supplies
# the same AF_UNIX sockets with std's `UnixStream` shape; `src/local_socket.rs` picks between them
# and nothing else in the editor changes. The wire is byte-identical on all three platforms.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"

[lints.clippy]
all = "deny"
