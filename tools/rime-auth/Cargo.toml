# SPDX-License-Identifier: Apache-2.0
# rime-auth — authentication for the hosted front end (ADR-0048).
#
# A SEPARATE CRATE so it can be left out. `rime-gateway` depends on it behind the `auth` feature:
# hosted builds enable it, exported game bundles do not. That is a licensing decision as much as an
# architectural one — passkey verification needs `webauthn-rs`, which is MPL-2.0, and ADR-0046 §2 would
# otherwise put that obligation inside every game a Rime user ships (ADR-0048 decision 2).
#
# Brick 1 of three is the STORE. The ceremonies (webauthn-rs, mailed codes) and the gate
# (owner_account_id through admission) are bricks 2 and 3; neither is present yet.
[package]
name = "rime-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Accounts, invitations and sessions for Rime's hosted front end"

[dependencies]
# The only dependency, and it is a hash. Token values are stored hashed so a stolen store is not a
# stolen set of credentials, and hand-rolling SHA-256 for a security boundary to save a dependency
# would be the wrong trade — ADR-0048 decision 3. RustCrypto, MIT OR Apache-2.0, pure Rust.
sha2 = "0.10"

[lints.clippy]
all = "deny"
