# SPDX-License-Identifier: Apache-2.0
# rime-auth — authentication for the hosted front end (ADR-0048).
#
# A SEPARATE CRATE so it can be left out. `rime-gateway` depends on it behind the `auth` feature:
# hosted builds enable it, exported game bundles do not. That is a licensing decision as much as an
# architectural one — passkey verification needs `webauthn-rs`, which is MPL-2.0, and ADR-0046 §2 would
# otherwise put that obligation inside every game a Rime user ships (ADR-0048 decision 2).
#
# Brick 1 of three is the STORE. The ceremonies (webauthn-rs, mailed codes) and the gate
# (owner_account_id through admission) are bricks 2 and 3; neither is present yet.
[package]
name = "rime-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Accounts, invitations and sessions for Rime's hosted front end"

[dependencies]
# A hash, because token values are stored hashed so a stolen store is not a stolen set of credentials,
# and hand-rolling SHA-256 for a security boundary to save a dependency would be the wrong trade —
# ADR-0048 decision 3. RustCrypto, MIT OR Apache-2.0, pure Rust.
sha2 = "0.10"

# The passkey ceremonies (brick 2). ADR-0048 decision 2 ratified this dependency and made the whole
# crate optional because of it: `webauthn-rs` is MPL-2.0, and ADR-0046 §2 would otherwise put that
# obligation inside every game a Rime user ships. What it does is CBOR/COSE parsing and ES256
# signature verification against a server-issued challenge — a security boundary nobody should
# hand-roll.
webauthn-rs = "0.5"
# A credential is stored as the library's OWN serialisation, kept whole (`ceremony::decode_passkey`),
# and the ceremony options and responses cross the gateway as JSON strings so that no library type
# reaches admission or the engine (ADR-0048 decision 3).
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
# The mailed verification code is stored as an HMAC, never as the code: a store that holds the code
# holds a live credential. RustCrypto again, MIT OR Apache-2.0, and `subtle` is what makes the
# comparison constant-time rather than a timing oracle on a six-digit search space.
hmac = "0.12"
subtle = "2"

[dev-dependencies]
# A software authenticator, so the ceremony tests run REAL ceremonies: a challenge is signed by a key
# whose verification the test does not control, rather than asserted about by a mock. Same project as
# `webauthn-rs`, MPL-2.0, and a dev dependency — it is in no shipped artifact.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[lints.clippy]
all = "deny"
