# SPDX-License-Identifier: Apache-2.0
# coturn for rime: TLS-over-TCP listener only, relay locked to the gateway.

# TLS listener on loopback; rime-turn-proxy strips the PROXY v2 header and forwards.
tls-listening-ip=127.0.0.1
tls-listening-port=5350

# Disable all plain listeners.
no-udp
no-tcp
no-dtls

# Relay sockets bind CT 122's address on vmbr2.
relay-ip=10.77.0.22
min-port=51000
max-port=51031

# REST-style TURN credentials. The gateway and coturn read the same secret.
# apply.sh generates /etc/rime/turn-secret once, then substitutes it into this file.
use-auth-secret
static-auth-secret=__TURN_SECRET__

realm=rime.peekstar.eu

# Peer permission: block every destination, then allow only the gateway's media sockets
# (10.77.0.22 UDP ports 50000-50002; coturn's allowed-peer-ip is address-based).
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=10.77.0.22
# No TCP relaying (RFC 6062). allowed-peer-ip limits the ADDRESS only, never the port, and a relayed
# TCP connection to 10.77.0.22 would reach every TCP service on this container (sshd included) from the
# internet: the traffic is local, so the PVE firewall never sees it. Media is UDP; nothing needs TCP.
no-tcp-relay
# The port half of the restriction lives in nftables (turn-egress.nft): coturn's user may send to
# 10.77.0.22 only on the media ports.

no-multicast-peers
no-cli
fingerprint
total-quota=100
user-quota=10

cert=/etc/coturn/turn.rime.peekstar.eu.crt
pkey=/etc/coturn/turn.rime.peekstar.eu.key
