# SPDX-License-Identifier: Apache-2.0
# coturn for rime: TLS-over-TCP listener only, relay locked to the gateway.

# TLS listener on loopback; rime-turn-proxy strips the PROXY v2 header and forwards.
tls-listening-ip=127.0.0.1
tls-listening-port=5350

# Disable all plain listeners.
no-udp
no-tcp
no-dtls

# Relay sockets bind CT 122's address on vmbr2.
relay-ip=10.77.0.22
min-port=51000
max-port=51031

# REST-style TURN credentials. The gateway and coturn read the same secret.
# apply.sh generates /etc/rime/turn-secret once, then substitutes it into this file.
use-auth-secret
static-auth-secret=__TURN_SECRET__

realm=rime.peekstar.eu

# Peer permission: block every destination, then allow only the gateway's media sockets
# (10.77.0.22 UDP ports 50000-50002; coturn's allowed-peer-ip is address-based).
denied-peer-ip=0.0.0.0/0
denied-peer-ip=::/0
allowed-peer-ip=10.77.0.22/32

no-multicast-peers
no-cli
fingerprint
total-quota=100
user-quota=10

cert=/etc/coturn/turn.rime.peekstar.eu.crt
pkey=/etc/coturn/turn.rime.peekstar.eu.key
