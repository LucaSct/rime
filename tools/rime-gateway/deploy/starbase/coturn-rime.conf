# SPDX-License-Identifier: Apache-2.0
# Drop-in for Ubuntu's coturn.service, installed as /etc/systemd/system/coturn.service.d/rime.conf.
#
# The packaged unit runs `turnserver -c /etc/turnserver.conf`, but apply.sh writes rime's config to
# /etc/coturn/turnserver.conf. Without this drop-in coturn silently runs on the packaged defaults:
# no shared-secret auth, no peer restrictions, listening on every address (found on the first
# install, 2026-09-29). Overriding ExecStart rather than overwriting /etc/turnserver.conf keeps the
# package's conffile untouched, so an apt upgrade neither prompts nor reverts it.
[Service]
ExecStart=
ExecStart=/usr/bin/turnserver -c /etc/coturn/turnserver.conf --pidfile=
