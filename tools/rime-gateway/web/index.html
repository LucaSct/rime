<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rime</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-view="loading">
    <!-- The top bar is static markup, not a view: it is on screen in every state (including the
         no-JavaScript one), and app.js only fills its right-hand slot with whatever actions the
         current view offers (Sign out on the catalogue, the game's title in a session). -->
    <header class="topbar">
      <a class="brand" href="/" aria-label="Rime home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7" />
          <path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5" />
        </svg>
        <span class="brand-word">rime</span>
      </a>
      <div id="topbar-actions" class="topbar-actions"></div>
    </header>
    <!-- app.js replaces this on load; it is real content (not a spinner) so a browser with
         JavaScript disabled, or a crawler, sees an honest sentence instead of an empty page. -->
    <main id="app">
      <p>Rime needs JavaScript to run.</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
