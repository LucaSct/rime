# SPDX-License-Identifier: Apache-2.0
# rime-gateway — the hosted front end's session broker (Track H, ADR-0045 / ADR-0046 §2).
#
# It owns everything tenant-shaped that must stay OUT of engine/: session admission, the per-session
# engine process, and — the property this first brick exists for — the SURFACE POLICY. A hosted
# session is either an `edit` session or a `play` session, and that is a fact about the session the
# gateway created, never something the browser asserts. A play session's `0x02xx` editor band is
# dropped here, so the engine is never asked to answer "may this peer edit?" about an untrusted peer.
#
# A bounded HTTP/1.1 surface and the session API landed on top of that filter (`http.rs`, `api.rs`),
# hand-rolled with no new dependency for the reason `rime-protocol` has none. TLS, auth and WebRTC are
# still absent: TLS and the hostname belong to blackStar, the estate's edge (ADR-0047 §3), and v1 is
# un-authenticated by ADR-0045's last consequence. Deleting this crate leaves the engine unchanged
# (guardrail 2).
[package]
name = "rime-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Session broker for Rime's hosted browser front end (surface policy, per-session engine process)"

[[bin]]
name = "rime-gateway"
path = "src/bin/rime-gateway.rs"

[dependencies]
rime-protocol = { path = "../rime-protocol" }

# The ONE third-party dependency this crate has, and the reason is that the alternative is worse.
# WebRTC needs ICE, DTLS-SRTP, SCTP and RTP packetisation; the verification alone means CBOR/COSE and
# ES256, and hand-rolling cryptographic transport is not a thing to do to save a dependency.
#
# `str0m` is SANS-IO: it owns no sockets, spawns no threads and forces no async runtime on us, so the
# blocking HTTP server and process supervisor already in this crate keep working unchanged. A
# full-stack alternative would have made tokio viral through code that is already written and merged.
#
# `default-features = false` is load-bearing twice over. The default set is `["aws-lc-rs", "examples"]`
# and `examples` pulls in `rouille` — an entire HTTP server framework — which would ship inside every
# exported game bundle (ADR-0046 §2 puts this gateway in the bundle). `rust-crypto` selects the pure
# Rust backend instead, so there is no vendored C to build on three CI platforms.
#
# Licence: MIT OR Apache-2.0, so Apache-2.0-safe, the same test `third_party/` policy applies to
# libjpeg-turbo and lz4 (engine/stream/include/rime/stream/frame_codec.hpp:28).
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }

# TURN credentials (`turn.rs`) are an HMAC-SHA1. `hmac` and `sha1` are ALREADY in `Cargo.lock` and
# already compiled for this crate: `str0m`'s DTLS and STUN code depend on both (`cargo tree -i sha1`),
# so these two lines add no new code to the build, only a direct name for it. There is no `base64`
# here on purpose: it is in the lock file only through `webauthn-rs`, which this build may not
# include, and the one 20-byte encode is written by hand in `turn.rs` beside its test vector.
hmac = "0.12"
sha1 = "0.10"

# Authentication is OPTIONAL, and the flag is a licensing boundary as much as a build one (ADR-0048
# decision 2). Passkey verification needs `webauthn-rs`, which is MPL-2.0; ADR-0046 §2 puts this gateway
# inside every exported game, so without the flag every game a Rime user ships would carry that
# obligation. Hosted builds turn `auth` on; exported bundles leave it off and need no accounts anyway.
rime-auth = { path = "../rime-auth", optional = true }

# The QR code a desktop shows so a phone can approve its sign-in (ADR-0055). Rendered server-side as
# SVG, because the alternative is a QR encoder in the page — the same Reed-Solomon arithmetic written
# a second time in a language this repository does not otherwise test. OPTIONAL and pulled in only by
# the `auth` feature: a pairing is an account ceremony, and an exported game has no accounts, so the
# bundle ADR-0046 §2 ships never compiles it. `default-features = false` drops `image` (an entire
# raster-codec stack) and `pic`; `svg` is the one renderer used, and it is plain string building with
# no dependencies of its own. Licence: MIT OR Apache-2.0 (crates.io, qrcode 0.14.1), Apache-2.0-safe.
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

# Unix-only, like the `auth_api` module whose tests are their only users. `webauthn-rs` pulls
# `openssl-sys` unconditionally, and ADR-0051 keeps that off the Windows leg; an unconditional
# dev-dependency would drag it back in through `cargo test` even with `--exclude rime-auth`.
[target.'cfg(unix)'.dev-dependencies]
# The account endpoints are tested by driving real ceremonies through them: a software authenticator
# signs a challenge it did not choose, and the response crosses the HTTP surface as the browser's own
# JSON. Mocking that would test the mock. All three are dev-only, so nothing here ships.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
webauthn-rs = "0.5"
serde_json = "1"

# The adapter that strips blackStar's PROXY v2 header before coturn (ADR-0053 decision 2). Unix-only:
# it runs in the Linux container next to coturn. The source is one file and uses only `std`.
[[bin]]
name = "rime-turn-proxy"
path = "src/bin/rime-turn-proxy.rs"

[features]
default = []
# Enables accounts, invitations and sessions. Required before the hosted front end may be published
# (ADR-0048); CI must keep BOTH configurations green, because an untested configuration is the one that
# breaks on the day it matters.
auth = ["dep:rime-auth", "dep:qrcode"]

[lints.clippy]
all = "deny"
