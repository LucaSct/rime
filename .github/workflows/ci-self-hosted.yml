# Rime CI on the self-hosted runners — the long Linux jobs, on hardware we own.
#
# WHAT THIS IS FOR, MEASURED RATHER THAN ASSUMED. The hosted job durations on one healthy run
# (#279, 2026-10-07): sanitizer ASan+UBSan **25 min**, Windows 23, macOS 18, ubuntu 14, SDK consumer
# 8, Editor smoke 8, TSan 5, format 1. So the critical path of a healthy run is a LINUX job, and
# moving the two longest Linux jobs onto warm runners shortens the run itself — not only the
# feedback. (An earlier version of this file claimed the opposite, "the hosted macOS and Windows legs
# end the run". That was generalised from the starved, apt-hung runs we happened to be watching that
# evening, and the measurement above is what corrected it.)
#
# The second win is queue independence: on 2026-10-06 a 24-run cascade starved the hosted macOS pool
# for six hours, and on 2026-10-07 GitHub's apt mirrors hung three Linux jobs in
# `Install Linux deps` for over three hours. A warm self-hosted runner does not run apt at all.
#
# `.github/workflows/ci.yml` still gates macOS, Windows and fork pull requests. For our own pushes every
# Linux job lives HERE, and the hosted twin of each is its exact complement (see the `if:` guards).
#
# SECURITY: WHY THERE IS NO `pull_request` TRIGGER. LucaSct/rime is PUBLIC, and on a `pull_request`
# event GitHub runs the workflow file from the PULL REQUEST's head — so a fork could add a job that
# targets `self-hosted`, and an `if:` guard inside this file cannot prevent it, because the fork
# controls the guard too. Persistent runners therefore see pushes and manual dispatches only. The
# controls that actually hold: no fork-PR trigger, the repository's "require approval for all
# external contributors" policy, `permissions: {}`, and no secrets reachable from these jobs.
# docs/ci/self-hosted-runners.md states the residual risk and the stronger private-bridge design.
#
# EACH JOB CHECKS OUT INTO ITS OWN SUBDIRECTORY, and that is not cosmetic. `scripts/build.sh`
# layers `--sanitizer address` onto the SAME `build/dev` directory as a plain build (see its own
# comment at scripts/build.sh:89-102: the directory remembers what it was last told). A runner's
# workspace persists between jobs, so a shared tree would make the plain build and the ASan build
# reconfigure and invalidate each other on every run — destroying the warm cache this whole setup
# exists for. Separate paths, separate build trees, both stay warm.
name: CI (self-hosted)

on:
  # EVERY branch, not just main and feat/**. The narrow filter was a coverage HOLE the moment the
  # hosted Linux jobs stopped duplicating this workflow: a branch named fix/..., ci/..., perf/...
  # matched neither pattern, so it got no Linux build and no sanitizer from anywhere. #283 and #284
  # both merged that way -- 8 checks each, all of them hosted, none self-hosted -- which is exactly
  # the kind of gap that reads as "green" until you list the check NAMES rather than count them.
  # Fork code is still kept out by the actor guard on each job below, not by this filter.
  push:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Which runner to use: rime-linux (any idle one), or a machine label to pin it"
        type: choice
        default: rime-linux
        options: [rime-linux, starbase, nextos]

# Keyed on the runner selection as well as the ref: a pinned diagnostic dispatch must not fight a
# push build for one slot. It did, in the first version of this file — the dispatch cancelled an
# in-flight build on the other machine, which is a silly way to lose a measurement.
concurrency:
  group: ci-self-${{ github.ref }}-${{ inputs.runner_label || 'push' }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: self-hosted build & test (${{ inputs.runner_label || 'rime-linux' }})
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'rime-linux' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 75 # the starbase container is a 2012 i7: a cold build there is slow but finite
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-build
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-build
          persist-credentials: false # leave no token in .git/config on a machine that keeps its disk

      - name: Check free disk
        run: |
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb} GB"
          if [ "$free_gb" -lt 15 ]; then
            echo "::error::under 15 GB free — clean the runner's caches (docs/ci/self-hosted-runners.md)"
            exit 1
          fi

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      # Pin the Vulkan device. Both runners can see more than one ICD (CT 123 has llvmpipe; the
      # workstation has an RTX 3060 and an AMD iGPU), and Rime's render proofs are structural with
      # margins TAKEN AGAINST LAVAPIPE. Letting the loader choose would mean a green run measured a
      # different device depending on which machine picked up the job.
      - name: Pin lavapipe + a virtual display
        run: |
          # Both Ubuntu 24.04's mesa-vulkan-drivers and Arch's vulkan-swrast install it as
          # lvp_icd.json (measured on both runners); older Debian/Ubuntu used lvp_icd.x86_64.json.
          # The glob covers both — the first version matched only the suffixed name and failed the
          # job, which is at least the behaviour we want from a wrong guess.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD — install mesa-vulkan-drivers (Ubuntu) or vulkan-swrast (Arch)"
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "RIME_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
          # Both halves of this matter on a runner whose processes outlive a job. `pgrep -x Xvfb`
          # matched any Xvfb anywhere on the machine — a leftover on :98, a desktop's own — so it
          # could read "already up" while :99 was dead; `pgrep -f 'Xvfb :99'` asks about THIS display
          # and about a LIVE process, which a bare socket test cannot, since /tmp/.X11-unix/X99
          # survives a SIGKILLed server. Then wait: the old code exported DISPLAY=:99 before Xvfb had
          # bound it. Both failures surface as an unrelated GUI test "cannot open display".
          # (`pgrep -f` is safe here because a `run:` block executes as a script FILE, so the pattern
          # is not in any process's command line. Typed into an interactive shell it self-matches.)
          if ! pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          fi
          [ -e /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb :99 did not come up"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: ccache
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --zero-stats >/dev/null

      - name: Build & test
        run: ./scripts/build.sh

      - name: Cache statistics (what made this run fast, or didn't)
        if: always()
        run: |
          ccache --show-stats | head -12
          echo "conan cache: $(du -sh "$HOME/.conan2" 2>/dev/null | cut -f1)"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ runner.name }}-${{ github.run_number }}
          path: ci-build/build/dev/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: warn

  asan:
    # The 25-minute job, and therefore the one worth moving. Its own checkout path keeps its
    # sanitizer-configured build tree from fighting the plain build above.
    name: self-hosted sanitizer (ASan + UBSan)
    #
    # `bigmem`, NOT `rime-linux`, and the reason is measured rather than preferred. `rime_render_tests`
    # under ASan is a single process whose anon working set grows past 6.87 GiB (ASan's redzones and
    # quarantine over lavapipe's host-memory framebuffers). The starbase container is capped at 8 GB
    # because `universe/starbase/scripts/rime-ci-runner.sh` states the rule that CI must always lose
    # to the service containers on that host -- so the job does not fit there, and giving it room
    # would mean overriding that rule rather than respecting it. Three cgroup OOM kills on
    # 2026-10-08 are the evidence; raising the cap 5.37 -> 7 GiB only moved the kill point, because
    # the process grows until it meets the ceiling.
    #
    # It also belongs here on SPEED: 10.2 min on nextos (run 37809196770) against 26.3 min on
    # starbase before it died. So the capability label costs a queue wait on one machine and buys
    # both a 2.6x faster job and a job that finishes at all. starbase keeps the five small jobs.
    #
    # A `workflow_dispatch` pin still overrides this, deliberately: pinning ASan to starbase is how
    # you re-measure the ceiling, and it should fail there until the ceiling changes.
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'bigmem' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 120 # ASan is 2-3x a plain build, and the starbase container is slow
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-asan
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-asan
          persist-credentials: false

      - name: Check free disk
        run: |
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb} GB"
          [ "$free_gb" -ge 15 ] || { echo "::error::under 15 GB free"; exit 1; }

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Pin lavapipe + a virtual display
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          [ -n "$icd" ] || { echo "::error::no lavapipe ICD"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "RIME_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
          # Display-specific and waits for the socket; see the `build` job above for why.
          if ! pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          fi
          [ -e /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb :99 did not come up"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: ccache
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --zero-stats >/dev/null

      # Identical env to ci.yml's job, so a failure here means the same thing it would there.
      - name: Build & test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./scripts/build.sh --cpp-only --sanitizer address

      # `--no-tests=error` is load-bearing, copied from ci.yml for the reason recorded there: ctest
      # with a name regex that matches nothing prints "No tests were found!!!" and exits ZERO, so a
      # renamed target would silently empty this step and leave it green.
      - name: Leak-check the GPU-free suites (LeakSanitizer)
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/ci-asan/scripts/lsan-suppressions.txt
        run: >-
          ctest --test-dir build/dev --output-on-failure --no-tests=error -R
          'rime_core_tests|rime_ecs_tests|rime_physics_tests|rime_assets_tests|rime_destruction_tests|rime_capi_tests|hello_game_selftest'

      - name: Cache statistics
        if: always()
        run: ccache --show-stats | head -12

  # ── The four small Linux jobs ci.yml used to run on ubuntu-latest ────────────────────────────────
  # Each one is the hosted job's twin: same commands, same env, own checkout directory (so no two
  # jobs share a build tree on a persistent disk). ci.yml's copy of each now runs only for a fork,
  # on the exact complement of the guard below, so every push is covered by exactly one of the two.
  # No `apt` anywhere: the runners are provisioned (starbase: rime-ci-toolchain.sh; nextos:
  # github-runner-install.sh) and the account running the job has no sudo, so a package that is
  # missing fails the job loudly instead of stalling on a mirror.

  tsan:
    name: self-hosted sanitizer (TSan, Clang)
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'rime-linux' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-tsan
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-tsan
          persist-credentials: false

      - name: Check free disk
        run: |
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb} GB"
          [ "$free_gb" -ge 15 ] || { echo "::error::under 15 GB free"; exit 1; }

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: ccache
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --zero-stats >/dev/null

      # A TSan job that cannot detect a race is worse than no TSan job: it reads as "no races found".
      # A runner whose Clang has no TSan runtime, or whose kernel's ASLR layout TSan cannot map,
      # would build the targets below happily and then either fail to link or run the tests
      # uninstrumented. So prove the instrument first: compile a program with a deliberate data race
      # and require TSan to REPORT it (and to exit nonzero). Costs about a second.
      - name: Canary - TSan must detect a known race on this runner
        run: |
          clang --version | head -1
          d=$(mktemp -d)
          cat > "$d/race.cpp" <<'CPP'
          #include <thread>
          int g = 0;
          int main() {
            std::thread a([] { for (int i = 0; i < 100000; ++i) ++g; });
            std::thread b([] { for (int i = 0; i < 100000; ++i) ++g; });
            a.join(); b.join();
            return 0;
          }
          CPP
          clang++ -std=c++20 -O1 -g -fsanitize=thread "$d/race.cpp" -o "$d/race" -pthread
          set +e
          "$d/race" > "$d/out.txt" 2>&1
          rc=$?
          set -e
          head -8 "$d/out.txt"
          if ! grep -q "WARNING: ThreadSanitizer: data race" "$d/out.txt" || [ "$rc" -eq 0 ]; then
            echo "::error::TSan did not report the known race (exit $rc) - this runner cannot run the TSan job meaningfully"
            exit 1
          fi
          rm -rf "$d"

      # Same commands as ci.yml's sanitize-thread; see the comments there for why Clang, why the
      # host=Clang / build=GCC profile split, and why only three GPU-free targets are built.
      - name: Configure + build core + ecs + assets tests (Clang, TSan)
        run: |
          CC=clang CXX=clang++ conan profile detect --name clang --force
          printf '[conf]\ntools.build:compiler_executables={"c": "clang", "cpp": "clang++"}\n' \
            >> "$(conan profile path clang)"
          scripts/conan-export-local.sh conan
          conan install . -of build/dev -s build_type=Debug -s compiler.cppstd=20 \
            -s "libsvtav1/*:build_type=Release" -s "dav1d/*:build_type=Release" \
            -pr:h clang -pr:b default --build=missing
          CC=clang CXX=clang++ cmake -S . -B build/dev -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/dev/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Debug -DRIME_SANITIZER=thread
          CC=clang CXX=clang++ cmake --build build/dev --target rime_core_tests rime_ecs_tests \
            rime_assets_tests

      - name: Run core + ecs + assets tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/dev -R 'rime_core_tests|rime_ecs_tests|rime_assets_tests'
          --output-on-failure --no-tests=error

      - name: Cache statistics
        if: always()
        run: ccache --show-stats | head -12

  sdk-consumer:
    name: self-hosted SDK consumer (out-of-tree install)
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'rime-linux' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-sdk
          persist-credentials: false

      - name: Check free disk
        run: |
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb} GB"
          [ "$free_gb" -ge 15 ] || { echo "::error::under 15 GB free"; exit 1; }

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: ccache
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --zero-stats >/dev/null

      # The consumer runs HEADLESS (no Vulkan runtime needed), as on the hosted job. The install
      # prefix is build/dev/sdk-prefix, which scripts/sdk-smoke.sh rm -rf's before every install,
      # and the checkout above is a fresh tree anyway, so no stale file can satisfy find_package.
      - name: SDK smoke (install -> out-of-tree consumer)
        run: ./scripts/sdk-smoke.sh

      - name: Cache statistics
        if: always()
        run: ccache --show-stats | head -12

  editor-smoke:
    name: self-hosted Editor smoke (editor <-> live engine)
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'rime-linux' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-editor
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-editor
          persist-credentials: false

      - name: Check free disk
        run: |
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${free_gb} GB"
          [ "$free_gb" -ge 15 ] || { echo "::error::under 15 GB free"; exit 1; }

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      # The streamed-viewport half of the smoke renders engine-side on lavapipe, exactly like the
      # hosted job (which installs mesa-vulkan-drivers); pin it so a runner with a real GPU measures
      # the same device. The editor smoke itself opens no window; Xvfb is there for the egui
      # `--features gui` unit tests, in case a test touches a display.
      - name: Pin lavapipe + a virtual display
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          [ -n "$icd" ] || { echo "::error::no lavapipe ICD"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "RIME_REQUIRE_VULKAN=1" >> "$GITHUB_ENV"
          # Display-specific and waits for the socket; see the `build` job above for why.
          if ! pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          fi
          [ -e /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb :99 did not come up"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: ccache
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --zero-stats >/dev/null

      - name: Editor smoke (channel + streamed viewport, editor spawns rime-engine)
        run: ./scripts/editor-smoke.sh

      - name: Editor GUI build + unit tests (--features gui)
        run: cd tools && cargo test -p editor --bins --features gui

      - name: Authoring round trip (blockgen -> game -> editor -> game)
        run: ./scripts/authoring-round-trip.sh

      - name: Cache statistics
        if: always()
        run: ccache --show-stats | head -12

  lint:
    name: self-hosted format, lint & license
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label || 'rime-linux' }}"]
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ci-lint
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci-lint
          persist-credentials: false

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.ci-venv/bin" >> "$GITHUB_PATH"

      # ci.yml pins dtolnay/rust-toolchain@stable, which FLOATS, so the hosted lint always runs the
      # newest stable clippy. A persistent runner's toolchain does not move by itself and would go
      # on passing lints the hosted job rejects, so refresh it here. Bounded, and non-fatal: a
      # stalled network must not fail a job whose toolchain is already installed.
      - name: Refresh stable Rust (the hosted job floats on stable)
        run: timeout 300 rustup update stable --no-self-update || echo "::warning::rustup update failed; using the installed toolchain"

      # The runner's distro clang-format is NOT the pinned one (starbase ships 18, CI pins 20.1.8),
      # and formatting differs between majors. pip is a no-op once the pin is in the runner's venv.
      - name: Pinned clang-format
        run: |
          timeout 300 pip install -q "clang-format==20.1.8"
          clang-format --version

      - name: C++ formatting (clang-format)
        run: find engine tests \( -name '*.cpp' -o -name '*.hpp' -o -name '*.mm' \) -exec clang-format --dry-run --Werror {} +

      - name: C99 header compile (rime/capi/rime.h)
        run: cc -std=c99 -Wall -Wextra -Werror -Iengine/capi/include -fsyntax-only engine/capi/include/rime/capi/rime.h

      - name: Rust formatting (cargo fmt)
        working-directory: ci-lint/tools
        run: cargo fmt --all -- --check

      - name: Rust lints (clippy)
        working-directory: ci-lint/tools
        run: cargo clippy --all-targets -- -D warnings

      - name: License headers (SPDX)
        run: ./scripts/check-license-headers.sh

      # See ci.yml for why: Windows PowerShell 5.1 reads a BOM-less .ps1 as ANSI.
      - name: PowerShell scripts are ASCII (Windows PowerShell reads them as ANSI, not UTF-8)
        run: |
          if grep -rlP '[^[:ascii:]]' scripts/*.ps1; then
            echo "::error::the .ps1 file(s) listed above contain non-ASCII bytes; see the header" \
                 "comment in scripts/setup.ps1 for why that stops the script from running"
            exit 1
          fi
